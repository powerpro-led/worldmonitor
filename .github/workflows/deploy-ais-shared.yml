name: Deploy Shared AIS Ingest (P14 / P17)

# The ONE shared AIS-ingest deploy — scripts/ais-relay.cjs run once for every
# org (PLATFORM_ARCHITECTURE.md P14 / P16 / P17; deploy/shared/README.md).
#
# wss://stream.aisstream.io is the one genuinely persistent connection in the
# stack and the vessel feed is public + identical per tenant, so it runs
# shared instead of once per org. This deploy holds ONLY its own credentials —
# it never writes into a tenant DB. It writes supply_chain:chokepoint_transits:v1
# into a shared "AIS results" Upstash; each org's deploy runs
# scripts/sync-ais-results.mjs to pull that into the org's own DB (P17).
#
# Manual-only, same rationale as deploy-org.reusable.yml: an on-push trigger
# would redeploy live infrastructure on every unrelated merge.
#
# NOT a nitric deploy (changed 2026-09-18). It used `nitric up --stack
# ais-shared` until the first runs that actually got that far showed the model
# doesn't fit: `nitric up` declares resources by booting EVERY service in
# nitric.yaml and collecting what each declares — and that collection phase is
# stack-agnostic and receives no app env, so a stack cannot opt out of another
# service's resources. This deploy needs exactly one long-lived container, but
# it was declaring all 83 of gcp/scheduler/main.ts's Cloud Scheduler cadences
# against the shared project, which holds no tenant credentials to run them
# with. (AIS_SHARED_SCHEDULER, added 2026-09-16 to suppress exactly that, could
# never have worked for the same reason — it was read at collection time, where
# no app env exists.) And scripts/ais-relay.cjs imports @nitric/sdk zero times:
# it declares no nitric resources at all, so nitric bought this deploy nothing
# while forcing the whole app image on it. Now: build Dockerfile.relay, push to
# Artifact Registry, `gcloud run deploy`. nitric.ais-shared.yaml is retained
# only as the source of the resource settings mirrored below.
#
# Required GH Environment `ais-shared` (see deploy/shared/README.md for the
# full table):
#   GCP_CREDENTIALS                                    — SA JSON for the shared GCP project
#   AISSTREAM_API_KEY                                   — the shared aisstream.io key
#   AIS_RESULTS_UPSTASH_REST_URL / _REST_TOKEN          — shared "AIS results" Upstash, WRITE side
#   OREF_PROXY_URL (+ OREF_PROXY_AUTH if used)          — residential proxy, Israel exit, for the siren poller
#   OPENSKY_CLIENT_ID / OPENSKY_CLIENT_SECRET           — OpenSky OAuth for the /opensky proxy route
#   RELAY_SHARED_SECRET                                 — the x-relay-key every per-org deploy sends
#   vars.APP_DOMAIN                                     — CORS allow-list derivation
# PULUMI_ACCESS_TOKEN is no longer read here (no Pulumi in this path).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm — this (re)deploys the shared AIS-ingest infrastructure.'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy shared AIS ingest
    runs-on: ubuntu-latest
    environment: ais-shared

    # Mirrors nitric.ais-shared.yaml's region + gcp-project-id, which this
    # workflow no longer reads (see the header note on dropping nitric).
    env:
      GCP_PROJECT: apps-453107
      REGION: us-central1
      AR_REPO: ais-shared
      SERVICE: ais-relay
      # Job-level env can't interpolate its own keys — keep this in sync with
      # the four above: <REGION>-docker.pkg.dev/<GCP_PROJECT>/<AR_REPO>/<SERVICE>
      IMAGE: us-central1-docker.pkg.dev/apps-453107/ais-shared/ais-relay

    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'DEPLOY' }}
        run: |
          echo "::error::Confirmation input must be exactly 'DEPLOY' (got '${{ inputs.confirm }}')."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Setup GCP Docker Auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$AR_REPO" \
            --project="$GCP_PROJECT" --location="$REGION" >/dev/null 2>&1 \
          || gcloud artifacts repositories create "$AR_REPO" \
               --project="$GCP_PROJECT" --location="$REGION" \
               --repository-format=docker \
               --description="Shared AIS ingest relay images"

      - name: Build and push the relay image
        run: |
          set -euo pipefail
          docker build -f Dockerfile.relay -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # The relay's runtime env — its OWN credentials only, no tenant secrets.
      # Written to a file rather than passed via --set-env-vars so secret
      # values never appear in a command line.
      - name: Write runtime env file
        run: |
          umask 077
          cat > /tmp/relay-env.yaml <<EOF
          AISSTREAM_API_KEY: "${{ secrets.AISSTREAM_API_KEY }}"
          AIS_RESULTS_UPSTASH_REST_URL: "${{ secrets.AIS_RESULTS_UPSTASH_REST_URL }}"
          AIS_RESULTS_UPSTASH_REST_TOKEN: "${{ secrets.AIS_RESULTS_UPSTASH_REST_TOKEN }}"
          UPSTASH_REDIS_REST_URL: "${{ secrets.AIS_RESULTS_UPSTASH_REST_URL }}"
          UPSTASH_REDIS_REST_TOKEN: "${{ secrets.AIS_RESULTS_UPSTASH_REST_TOKEN }}"
          OREF_PROXY_URL: "${{ secrets.OREF_PROXY_URL }}"
          OREF_PROXY_AUTH: "${{ secrets.OREF_PROXY_AUTH }}"
          OPENSKY_CLIENT_ID: "${{ secrets.OPENSKY_CLIENT_ID }}"
          OPENSKY_CLIENT_SECRET: "${{ secrets.OPENSKY_CLIENT_SECRET }}"
          RELAY_SHARED_SECRET: "${{ secrets.RELAY_SHARED_SECRET }}"
          APP_DOMAIN: "${{ vars.APP_DOMAIN }}"
          EOF

      # Resource settings mirror nitric.ais-shared.yaml's `ais-relay` block:
      # 1 GB (live vessel/density aggregates held in memory), 300s timeout,
      # concurrency 80, and min=max=1 — the one pinned instance in the whole
      # platform, because a scale-to-zero relay drops its persistent
      # aisstream.io WebSocket between requests (OQ-P1/P8).
      #
      # INGRESS: per-org deploys reach this relay over the public internet and
      # authenticate at the application layer with RELAY_SHARED_SECRET via the
      # x-relay-key header (scripts/ais-relay.cjs refuses to start without that
      # secret). The service therefore needs unauthenticated Cloud Run ingress
      # — that is NOT granted here; it is a deliberate one-time operator step:
      #   gcloud run services add-iam-policy-binding ais-relay \
      #     --project=apps-453107 --region=us-central1 \
      #     --member=allUsers --role=roles/run.invoker
      # Re-deploys preserve the existing IAM policy, so this is only needed
      # once, on first creation.
      - name: Deploy to Cloud Run
        timeout-minutes: 15
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project="$GCP_PROJECT" \
            --region="$REGION" \
            --image="$IMAGE:${{ github.sha }}" \
            --env-vars-file=/tmp/relay-env.yaml \
            --memory=1Gi \
            --timeout=300 \
            --concurrency=80 \
            --min-instances=1 \
            --max-instances=1 \
            --quiet

      - name: Report service URL
        run: |
          url="$(gcloud run services describe "$SERVICE" \
            --project="$GCP_PROJECT" --region="$REGION" \
            --format='value(status.url)')"
          echo "::notice::ais-relay deployed at $url"
          echo "If this URL changed, update worldmonitor's repo-level WS_RELAY_URL variable."
