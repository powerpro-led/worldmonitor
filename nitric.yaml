name: worldmonitor
# Local dev-mode service matcher for `nitric start`/`nitric run`. Modeled on
# platform/backend's nitric.yaml (sibling repo, same GCP target). Each entry's
# `runtime` key must have a matching block in `runtimes:` below, which is what
# `nitric.gcp.yaml` + `nitric build` use to produce the deployable image.
#
# Scaffold-only pass — see docs/architecture/nitric-gcp-scaffold.md for what's
# real vs. stubbed here. No `nitric up` has been run against this config.
services:
  - match: gcp/api/main.ts
    start: npx tsx watch --env-file=.env $SERVICE_PATH
    runtime: api
  - match: gcp/scheduler/main.ts
    start: npx tsx watch --env-file=.env $SERVICE_PATH
    runtime: scheduler
  # The 5 `deployMode: "dockerfile"` entries in scripts/railway-services.json
  # (long-running processes, not discrete cron runs) — reuse their EXISTING
  # Dockerfiles unchanged, no Nitric SDK wrapper needed since none of them
  # import @nitric/sdk yet. min-instances for these will need a
  # nitric.gcp.yaml `config:` override before real deploy — scale-to-zero
  # breaks a persistent websocket relay / queue consumer. Not decided here;
  # see docs/architecture/nitric-gcp-scaffold.md.
  - match: scripts/ais-relay.cjs
    start: node $SERVICE_PATH
    runtime: relay
  - match: scripts/loop-digest-notifications.mjs
    # scripts/seed-digest-notifications.mjs is one-shot (main() + process.exit(),
    # no internal loop) — its real cadence came from Railway's own Cron Schedule
    # feature re-invoking the container every 30 min (Dockerfile.digest-notifications's
    # header + the script's own docblock), which is a re-invoke primitive this local
    # `services:` block doesn't have. A bare `node $SERVICE_PATH` on that script here
    # runs it exactly once at `nitric start` and never again — found 2026-08-23 via a
    # genuinely stale Latest Brief (stuck a day behind because nothing was re-composing
    # it locally).
    #
    # Matches scripts/loop-digest-notifications.mjs (a real file, not the digest
    # script itself) rather than an inline `sh -c "while true; do ...; done"` on the
    # digest script directly — that inline form previously threw `unexpected EOF
    # while looking for matching "` on every `nitric start` (confirmed live
    # 2026-08-31: nitric's local start-command parser splits a quoted -c argument
    # on whitespace instead of passing it through intact). A plain `node
    # $SERVICE_PATH` pointed at a real wrapper file sidesteps that parser
    # entirely — see that file's own header for the loop itself. Production's
    # Dockerfile.digest-notifications is untouched: it still runs the digest
    # script directly, one-shot, per Railway's cron — this loop only exists for
    # local `nitric start` dev sessions.
    start: node $SERVICE_PATH
    runtime: digest-notifications
  - match: scripts/seed-bundle-portwatch-port-activity.mjs
    start: node $SERVICE_PATH
    runtime: seed-bundle-portwatch-port-activity
  - match: scripts/seed-bundle-resilience-validation.mjs
    # Sensitivity-Suite (validate-resilience-sensitivity.mjs) dynamically imports
    # ../server/*.ts — needs the tsx ESM loader registered via NODE_OPTIONS so
    # _bundle-runner.mjs's spawned node children inherit it too (spawn() inherits
    # process.env by default). Mirrors Dockerfile.seed-bundle-resilience-validation's
    # ENV NODE_OPTIONS wiring, which local `node $SERVICE_PATH` never had.
    start: NODE_OPTIONS=--import=file://$PWD/node_modules/tsx/dist/loader.mjs node $SERVICE_PATH
    runtime: seed-bundle-resilience-validation
  - match: scripts/publish-bootstrap-tiers.mjs
    start: node $SERVICE_PATH --loop
    runtime: publish-bootstrap-tiers
  # 3 more always-on services, added 2026-08-06 after discovering (while
  # filling in gcp/scheduler/main.ts's cadences) that these `deployMode:
  # "nixpacks-root-scripts"` registry entries are actually always-on Railway
  # workers, not periodic crons — see docs/architecture/nitric-gcp-scaffold.md.
  # New Dockerfiles (not reused from Railway, which used bare nixpacks
  # detection) since GCP/Nitric needs an explicit image.
  - match: scripts/process-simulation-tasks.mjs
    start: node $SERVICE_PATH
    runtime: process-simulation-tasks
  - match: scripts/process-deep-forecast-tasks.mjs
    start: node $SERVICE_PATH
    runtime: process-deep-forecast-tasks
  - match: scripts/scenario-worker.mjs
    start: node $SERVICE_PATH
    runtime: scenario-worker

runtimes:
  api:
    dockerfile: gcp/api/node.dockerfile
    context: .
  scheduler:
    dockerfile: gcp/scheduler/node.dockerfile
    context: .
  relay:
    dockerfile: Dockerfile.relay
    context: .
  digest-notifications:
    dockerfile: Dockerfile.digest-notifications
    context: .
  seed-bundle-portwatch-port-activity:
    dockerfile: Dockerfile.seed-bundle-portwatch-port-activity
    context: .
  seed-bundle-resilience-validation:
    dockerfile: Dockerfile.seed-bundle-resilience-validation
    context: .
  publish-bootstrap-tiers:
    dockerfile: Dockerfile.publish-bootstrap-tiers
    context: .
  process-simulation-tasks:
    dockerfile: Dockerfile.process-simulation-tasks
    context: .
  process-deep-forecast-tasks:
    dockerfile: Dockerfile.process-deep-forecast-tasks
    context: .
  scenario-worker:
    dockerfile: Dockerfile.scenario-worker
    context: .
