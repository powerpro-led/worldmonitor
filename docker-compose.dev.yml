# Local dev data layer: Redis + an Upstash-REST-compatible proxy in front of it.
#
# This is a DEV-LOOP ONLY slice, deliberately not a restoration of the
# self-hosting stack removed in 87787be (no app, nginx, or relay services --
# that product surface stays retired). It exists because this repo speaks
# Upstash's HTTP REST protocol, not RESP, in ~184 files: swapping
# UPSTASH_REDIS_REST_URL to point here needs zero application code changes.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down          # keeps data
#   docker compose -f docker-compose.dev.yml down -v       # wipes data
#
# Requires REDIS_PASSWORD and REDIS_TOKEN in .env (compose reads it
# automatically for interpolation). Generate with: openssl rand -hex 32
#
# Neither service is reachable off this machine: redis publishes no port at
# all, and the proxy binds explicitly to 127.0.0.1.

services:
  redis:
    image: docker.io/redis:7-alpine
    container_name: worldmonitor-redis
    # --requirepass is defence-in-depth alongside the REST token: it stops any
    # other container on this machine's default networks from reading or writing
    # cache entries even if it can reach the port.
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required — generate with: openssl rand -hex 32}"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-rest:
    # Uses the already-built local image rather than `build:`. The proxy source
    # is bind-mounted over it, so edits to redis-rest-proxy.mjs take effect on
    # `restart` with no rebuild -- which also avoids pulling the pinned
    # node:24-alpine base layer. To rebuild properly:
    #   docker build -t worldmonitor-redis-rest:latest -f docker/Dockerfile.redis-rest docker
    image: worldmonitor-redis-rest:latest
    container_name: worldmonitor-redis-rest
    ports:
      - "127.0.0.1:8079:80"
    volumes:
      - ./docker/redis-rest-proxy.mjs:/app/redis-rest-proxy.mjs:ro
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required — generate with: openssl rand -hex 32}@redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
