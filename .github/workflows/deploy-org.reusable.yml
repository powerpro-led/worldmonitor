name: Deploy Org (reusable)

# worldmonitor's half of the per-org provisioning contract
# (powerpro-led/org-provisioning docs/PER_ORG_PROVISIONING_CONTRACT.md §5, §5b
# — RATIFIED 2026-09-10, org-provisioning v0.2.0). Supersedes the old
# `deploy-org.yml` (@a0a00a6), which checked out org-provisioning@v0.1.0 and
# called `./deploy.sh` itself. Under the contract, `org-provisioning`'s
# `provision-org.yml` owns the registry, the trigger, the identity-bridge
# deploy, and cross-repo sequencing (calling this file, then platform's own
# reusable, in `apps:` order); this file does ONLY worldmonitor's own deploy —
# schema apply, local-config, and the Nitric/Cloud Run deploy.
#
# `workflow_call` ONLY — the standalone `workflow_dispatch` entry point
# (contract §5c) was removed 2026-09-16 (operator decision): it required this
# repo's own `mosiq`/`biovita` GH Environments to carry a full duplicate copy
# of every secret org-provisioning's own same-named Environments already
# hold, and that duplication drifted (worldmonitor's copy predates several
# secrets org-provisioning now has). org-provisioning's `provision-org.yml`
# is the only supported way to run this now.
#
# `provision-org.yml` never calls this with `supabase_project_ref: local` —
# its step 3 "local short-circuit" no-ops before the fan-out for any org still
# on the shared local stack (contract §4 step 3). So every real invocation
# here has `target: "cloud"` and a real Supabase project ref.
#
# BUILD NOTE (contract, top of doc): a called `workflow_call` workflow does
# NOT inherit the caller's `environment:` context, only `secrets: inherit` —
# this job declares `environment: ${{ inputs.org }}` itself so the org's
# GitHub Environment secrets/vars actually resolve.
#
# Required GH Environment (name == `inputs.org`) contents — unchanged from
# the old deploy-org.yml except where noted:
#   SUPABASE_ACCESS_TOKEN     — authenticates the `supabase` CLI.
#   SUPABASE_DB_PASSWORD      — that org's Postgres password (supabase link).
#   SUPABASE_URL, SUPABASE_SECRET_KEY, VITE_SUPABASE_URL,
#   VITE_SUPABASE_PUBLISHABLE_KEY — that org's Supabase API credentials, both
#                               server- and client-facing.
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN — that org's Upstash
#                               WRITE credentials (the worker's own DB — NOT
#                               the read-only broker token operators get).
#   WM_UPSTASH_REST_URL, WM_UPSTASH_READONLY_TOKEN — 2 of local-config's 3
#                               secrets (P4); the 3rd (the org's app domain)
#                               now comes from `inputs.domains[0]`, not a
#                               secret — see the "domains remap" note below.
#   BEFORE_USER_CREATED_HOOK_SECRET — the invite gate's signing secret, added
#                               2026-09-19. Format `v1,whsec_<base64>`. Must
#                               be the SAME string in the function's env and
#                               in the project's auth config; the deploy
#                               writes both from this one value, which is why
#                               it lives here rather than being generated at
#                               deploy time.
#   WM_INVITE_ALLOWED_LOGINS  — comma-separated GitHub logins allowed to sign
#                               up. Needs no org and no PAT; the fallback when
#                               there is no organization to point at.
#   WM_INVITE_ALLOWED_ORG, WM_INVITE_ORG_READ_TOKEN — GitHub org membership,
#                               checked with a server-owned PAT needing only
#                               `read:org`. **The mode in use**: the `biovita`
#                               org was created 2026-09-19.
#                               Two constraints that both fail CLOSED, i.e.
#                               they deny everyone rather than erroring
#                               visibly, so get them right:
#                                 * the PAT's owner must themselves be a
#                                   member of the org — GitHub answers
#                                   `/orgs/{org}/members/{login}` with a 302
#                                   for a non-member requester, and the gate
#                                   treats anything but 204/404 as an
#                                   operational failure;
#                                 * the `biovita` org REJECTS fine-grained
#                                   PATs whose lifetime exceeds 366 days
#                                   (403, verified 2026-09-19 — this is an
#                                   org policy, not a GitHub-wide rule). Mint
#                                   the token with a lifetime under that, or
#                                   use a classic PAT.
# NOTE these three are GH Actions secret names, deliberately NOT prefixed
# `GITHUB_`: GitHub rejects any secret whose name starts with `GITHUB_` with a
# 422. The function's own Deno env vars are still GITHUB_ALLOWED_ORG /
# GITHUB_ORG_READ_TOKEN / GITHUB_ALLOWED_LOGINS — the mapping happens in the
# "Enable the invite gate" step.
#   Absent entirely: the gate stays OPEN and the run warns. It never
#   half-configures — see the "invite gate" steps below for why that matters.
#   Neither WM_INVITE_ALLOWED_LOGINS nor WM_INVITE_ALLOWED_ORG is actually secret;
#   they sit in the Environment only because this workflow's `vars.*` resolve
#   against THIS repo, not the per-org caller. Both belong in
#   org-provisioning's `orgs/<org>.yml` registry as inputs, like `domains`
#   and `variant`.
#   GCP_CREDENTIALS           — service account JSON scoped to that org's GCP project.
#   PULUMI_ACCESS_TOKEN       — Nitric's GCP provider deploys via Pulumi.
#   WM_SESSION_SECRET         — this deploy's own session signing secret.
#   AIS_RESULTS_UPSTASH_REST_URL, AIS_RESULTS_UPSTASH_READONLY_TOKEN — the
#                               SHARED "AIS results" Upstash, read-only (P17) —
#                               same value for every org.
#   TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_SESSION — this org's OWN
#                               Telegram MTProto app + session string (P18).
#   DATA_SHARED_UPSTASH_REST_URL, DATA_SHARED_UPSTASH_READONLY_TOKEN — the
#                               SHARED "data-shared" Upstash, read-only
#                               (CROSS_ORG_SHARED_DATA_PROPOSAL.md session 3) —
#                               same value for every org, same shape as the
#                               AIS_RESULTS_* pair above. Consumed only by
#                               scripts/sync-shared-results.mjs — this org's
#                               own local-config broker never sees it (see
#                               that proposal doc's "Session 3 addendum",
#                               point 5: confirmed local-config doesn't need
#                               a second credential pair at all).
#
# Retired from the old Environment list (contract §5b "domains remap" +
# §5c/§7): `vars.APP_DOMAIN` and `secrets.WM_APP_DOMAIN` (folded into
# `inputs.domains[0]`, passed by org-provisioning's registry); `vars.SUPABASE_PROJECT_REF`
# and `vars.VITE_VARIANT` (now `inputs.supabase_project_ref` / `inputs.variant`);
# `ORG_PROVISIONING_TOKEN` (org-level Actions sharing replaces the PAT, contract
# §7); the 5 github-identity-bridge function secrets + `SUPABASE_DB_URL` stay in
# the Environment for `org-provisioning/deploy.sh` to read (contract §6a) but
# this file never reads them — it doesn't check out or call the bridge.
#
# `vars.WS_RELAY_URL` (the ONE shared AIS-ingest deploy's URL, same for every
# org — non-secret) stays a repo-level variable in THIS repo, not per-org —
# a called reusable workflow's `vars.*` resolves against the repo that DEFINES
# it, so this is unaffected by anything org-provisioning passes as an input.
#
# What this workflow deliberately does NOT set: any of the ~26 data-source
# keys (ACLED, FRED, Finnhub, ...). Those live in the org's `pipeline_config`
# table, edited live via the Workstream 6 admin panel, and reach this
# deploy's running worker via the 5-minute hydration loop
# (server/_shared/pipeline-config-hydration.ts, OQ-P7) — not via any secret
# baked in at deploy time.

on:
  workflow_call:
    inputs:
      org:
        description: 'Org slug — must match a GH Environment name.'
        required: true
        type: string
      display_name:
        description: 'Human label — currently unused by this reusable, accepted for interface parity with platform.'
        required: true
        type: string
      supabase_project_ref:
        description: "That org's Supabase project ref. Never literally `local` here — org-provisioning's provision-org.yml short-circuits before calling this for a local-only org."
        required: true
        type: string
      target:
        description: 'Always "cloud" when org-provisioning calls this (its provision-org.yml never fans out for a local org).'
        required: true
        type: string
      gcp_project:
        description: "That org's GCP project id."
        required: false
        type: string
      gcp_region:
        description: 'Cloud Run region.'
        required: false
        type: string
      domains:
        description: "That org's domain(s), as a JSON array encoded in a string, e.g. '[\"dashboard.example.com\"]'. Only domains[0] is used — see the domains-remap note above."
        required: false
        type: string
      variant:
        description: 'Selects VITE_VARIANT at build time.'
        required: false
        type: string
      logo:
        description: 'Unused by this reusable, accepted for interface parity with platform.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy worldmonitor for this org
    runs-on: ubuntu-latest
    # MUST be declared here — a called workflow_call job does not inherit the
    # caller's `environment:` context, only its `secrets: inherit` (see the
    # BUILD NOTE above).
    environment: ${{ inputs.org }}

    steps:
      # A bare `actions/checkout` with no `repository:` checks out the
      # CALLER's repo (org-provisioning), not this one — invisible when this
      # workflow is only ever exercised via its own standalone
      # workflow_dispatch, but a real cross-repo `uses:` call (as
      # provision-org.yml's SHA-pinned fan-out does) needs this explicit.
      # `github.workflow_ref` is "owner/repo/path@ref" for the ref THIS
      # reusable workflow file is actually running at, unlike github.sha/
      # github.ref which reflect the caller — so parsing it out gives the
      # exact pinned commit regardless of which repo dispatched this run.
      - name: Resolve this workflow's own ref
        id: self_ref
        run: echo "ref=${GITHUB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: powerpro-led/worldmonitor
          ref: ${{ steps.self_ref.outputs.ref }}

      # `nitric up` builds this app's FULL image set (api/mcp/scheduler/every
      # script — no per-service selection, see the ais-shared deploy's own
      # header note on this same limitation) in one Docker Buildx pass.
      # ubuntu-latest ships ~14GB free but with Android SDK/.NET/GHC/etc.
      # preinstalled taking up the rest of the 84GB disk — biovita's first
      # real deploy attempt (2026-09-17) died mid-build with no error, just
      # the runner going silent (consistent with an OOM/disk-full kill, not
      # a clean failure). Reclaim the preinstalled toolchains nothing here
      # uses before the build gets underway.
      - name: Free disk space for the Docker build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # domains is a JSON array encoded as a string (contract §5); worldmonitor
      # only ever needed ONE domain (APP_DOMAIN) — the "domains remap" note
      # above. jq ships on the ubuntu-latest runner image.
      - name: Resolve primary domain
        id: domain
        run: |
          value=$(printf '%s' '${{ inputs.domains }}' | jq -Rr 'if length == 0 then "" else (fromjson | .[0] // "") end')
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Generate this org's Nitric stack file
        run: node scripts/generate-nitric-org-stack.mjs --org=${{ inputs.org }} --gcp-project=${{ inputs.gcp_project }} --gcp-region=${{ inputs.gcp_region }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ inputs.supabase_project_ref }} --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      # Applies supabase/migrations/* — pipeline_config (Workstream 1), whose
      # trailing ALTER ROLE authenticator SET pgrst.db_schemas was hardened at
      # 7170443 to the full schema list, safe for a shared project like
      # biovita too (contract §2's promotion carve-out); PLUS (added
      # 2026-09-14) the two reconstructed Stage 2/3 migrations —
      # user_preferences/followed_countries and
      # notification_channels/alert_rules/telegram_pairing_tokens — see
      # PLATFORM_ARCHITECTURE.md's 2026-09-14 Status entry for why these
      # exist as repo migrations now instead of only ever having been
      # MCP-applied. Idempotent (`create table if not exists`). This reusable
      # is the ONLY consumer of this project's `schema_migrations` across the
      # whole contract — see the contract §4 schema-apply table;
      # org-provisioning's `deploy.sh` and platform's `deploy-schema.sh` both
      # apply via raw SQL and never touch it.
      #
      # RUNBOOK NOTE (contract, carried forward — not automated here): `supabase
      # db push` hard-fails with `LegacyMigrationMissingLocalError` against any
      # target whose `supabase_migrations.schema_migrations` already has
      # version entries this repo's `supabase/migrations/` doesn't contain
      # (e.g. a project that was ever MCP-`apply_migration`'d directly, or
      # `psql`-applied by hand outside the CLI). Before promoting to such a
      # target, run `supabase migration repair --status applied <foreign
      # versions>` (or `supabase db pull` to baseline) against it FIRST, as a
      # separate manual step — this workflow does not attempt that
      # automatically, since the correct set of versions to mark differs per
      # target and getting it wrong risks the same-shaped disaster as the
      # pgrst.db_schemas clobber this step's first comment paragraph already
      # guards against. A target with zero migration history (a genuinely
      # fresh `create` project, or biovita post-2026-09-13-wipe if its own
      # `supabase_migrations` schema was wiped along with everything else —
      # unconfirmed, check before relying on it) needs no repair step.
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      # local-config keeps the CLI default (verify_jwt: true, P4).
      - name: Deploy local-config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy local-config

      # local-config's 3 secrets (P4). WM_APP_DOMAIN now comes from
      # inputs.domains[0] (the domains-remap note above), not a stored secret.
      - name: Set function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set \
            WM_UPSTASH_REST_URL="${{ secrets.WM_UPSTASH_REST_URL }}" \
            WM_UPSTASH_READONLY_TOKEN="${{ secrets.WM_UPSTASH_READONLY_TOKEN }}" \
            WM_APP_DOMAIN="${{ steps.domain.outputs.value }}"

      # ── The invite gate ────────────────────────────────────────────────
      #
      # `worldmonitor-org-gate` is the before-user-created Auth Hook that
      # restricts sign-up to members of one GitHub org. INSTALL.md,
      # vscode-extension/README.md and src/services/auth-provider.ts all
      # describe it as THE invite gate, and local-config/index.ts's whole
      # revocation design is built on top of it.
      #
      # It was not wired here until 2026-09-19, and the consequence was real:
      # the function was deployed on biovita and mosiq but
      # `hook_before_user_created_enabled` was `false` on both, so ANY GitHub
      # account could sign up and the local-config broker would hand it that
      # org's Upstash read-only credential. Deploying the function is not the
      # same as enabling it, and nothing before this step did the second half.
      - name: Deploy worldmonitor-org-gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # --no-verify-jwt: GoTrue calls this hook with a standardwebhooks
        # signature, never a Supabase JWT. The function verifies that
        # signature itself and rejects anything unsigned (400), so the
        # gateway's JWT check would only ever block the caller we want.
        run: supabase functions deploy worldmonitor-org-gate --no-verify-jwt

      - name: Enable the invite gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HOOK_SECRET: ${{ secrets.BEFORE_USER_CREATED_HOOK_SECRET }}
          ALLOWED_LOGINS: ${{ secrets.WM_INVITE_ALLOWED_LOGINS }}
          ALLOWED_ORG: ${{ secrets.WM_INVITE_ALLOWED_ORG }}
          ORG_READ_TOKEN: ${{ secrets.WM_INVITE_ORG_READ_TOKEN }}
          PROJECT_REF: ${{ inputs.supabase_project_ref }}
        run: |
          set -euo pipefail

          # FAIL-CLOSED FUNCTION, SO GUARD BEFORE ENABLING. The function
          # denies on any configuration it can't act on, GoTrue turns that
          # into a refused sign-up, and a before-user-created hook that always
          # denies locks EVERY new account out of the project. Enabling it
          # half-configured is strictly worse than leaving the gate open, so
          # this step refuses instead.
          #
          # Two usable modes (see the function's header): an explicit login
          # allow-list, or real GitHub org membership. At least one, plus the
          # hook secret.
          have_mode=0
          [ -n "${ALLOWED_LOGINS:-}" ] && have_mode=1
          [ -n "${ALLOWED_ORG:-}" ] && [ -n "${ORG_READ_TOKEN:-}" ] && have_mode=1
          if [ -z "${HOOK_SECRET:-}" ] || [ "$have_mode" -eq 0 ]; then
            echo "::warning title=Invite gate NOT enabled::Needs BEFORE_USER_CREATED_HOOK_SECRET plus either WM_INVITE_ALLOWED_LOGINS or both WM_INVITE_ALLOWED_ORG and WM_INVITE_ORG_READ_TOKEN. Sign-up for this org stays OPEN to any GitHub account. The auth config was left untouched; set them and re-run."
            exit 0
          fi

          # Only set what's configured — `supabase secrets set X=""` would
          # store an empty string, and the function treats empty and unset
          # alike, but an empty GITHUB_ALLOWED_ORG next to a real token would
          # still read as "org mode half-on" to a human reading the list.
          set -- BEFORE_USER_CREATED_HOOK_SECRET="$HOOK_SECRET"
          [ -n "${ALLOWED_LOGINS:-}" ] && set -- "$@" GITHUB_ALLOWED_LOGINS="$ALLOWED_LOGINS"
          [ -n "${ALLOWED_ORG:-}" ] && set -- "$@" GITHUB_ALLOWED_ORG="$ALLOWED_ORG"
          [ -n "${ORG_READ_TOKEN:-}" ] && set -- "$@" GITHUB_ORG_READ_TOKEN="$ORG_READ_TOKEN"
          supabase secrets set "$@"

          # No `supabase` CLI command covers auth hooks - Management API only.
          # Idempotent: re-running with the same values is a no-op PATCH.
          body=$(HOOK_SECRET="$HOOK_SECRET" PROJECT_REF="$PROJECT_REF" node -e '
            process.stdout.write(JSON.stringify({
              hook_before_user_created_enabled: true,
              hook_before_user_created_uri:
                `https://${process.env.PROJECT_REF}.supabase.co/functions/v1/worldmonitor-org-gate`,
              hook_before_user_created_secrets: process.env.HOOK_SECRET,
            }));
          ')
          code=$(printf '%s' "$body" | curl -sS -o /tmp/authcfg.json -w '%{http_code}' \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @-)
          if [ "$code" != "200" ]; then
            # Deliberately not echoing the response body - this endpoint
            # returns the project's whole auth config, the GitHub OAuth client
            # secret included.
            echo "::error::Enabling the invite gate failed: HTTP $code"
            exit 1
          fi
          if [ -n "${ALLOWED_LOGINS:-}" ]; then
            echo "Invite gate enabled - allow-list mode."
          fi
          if [ -n "${ALLOWED_ORG:-}" ] && [ -n "${ORG_READ_TOKEN:-}" ]; then
            echo "Invite gate enabled - org-membership mode ('$ALLOWED_ORG')."
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Setup GCP Docker Auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Install and configure Pulumi
        uses: pulumi/actions@a3f382e1242b69ab33854c253c3b580f1226348e # v4

      # Infra credentials this deploy's own worker needs at runtime — NOT the
      # ~26 data-source keys (those come from pipeline_config, see this
      # file's header). APP_DOMAIN + VITE_VARIANT now come from inputs
      # (the vars.* retirement note above), not GH Environment vars.
      - name: Create org env file
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          APP_DOMAIN=${{ steps.domain.outputs.value }}
          VITE_VARIANT=${{ inputs.variant }}
          WM_SESSION_SECRET=${{ secrets.WM_SESSION_SECRET }}
          WS_RELAY_URL=${{ vars.WS_RELAY_URL }}
          AIS_RESULTS_UPSTASH_REST_URL=${{ secrets.AIS_RESULTS_UPSTASH_REST_URL }}
          AIS_RESULTS_UPSTASH_READONLY_TOKEN=${{ secrets.AIS_RESULTS_UPSTASH_READONLY_TOKEN }}
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION=${{ secrets.TELEGRAM_SESSION }}
          DATA_SHARED_UPSTASH_REST_URL=${{ secrets.DATA_SHARED_UPSTASH_REST_URL }}
          DATA_SHARED_UPSTASH_READONLY_TOKEN=${{ secrets.DATA_SHARED_UPSTASH_READONLY_TOKEN }}
          WORKER_TIMEOUT=180
          EOF

      # WORKER_TIMEOUT above: Nitric's membrane starts the app process, then
      # waits for it to register its workers (one per api/schedule handler)
      # over gRPC, and exits FATAL if they don't arrive in time. The default is
      # 10 seconds (core/pkg/env/variables.go), which api/main.ts cannot make
      # on a Cloud Run cold start — `npx tsx` compiles TypeScript at boot,
      # routes.generated.ts pulls in ~105 route modules, and
      # startPipelineConfigHydration() awaits a live Supabase round-trip before
      # any route registers. The first real per-org deploy died exactly there:
      # "available workers below required minimum of 2, 0 available, timed out
      # waiting for more workers" 11s after the instance started (2026-09-18,
      # biovita). Nitric's own docs bump this the same way for slow-starting
      # services.

      # Runners are ephemeral, so BuildKit cache mounts start cold every run.
      # One cache key per org (region/config differ, but the npm-install
      # layer is identical across every org) — see nitric-deploy.yml for why
      # this materially speeds up repeat deploys.
      - name: Cache Nitric Docker layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nitric/docker-cache
          key: nitric-docker-${{ inputs.org }}-${{ runner.os }}-${{ hashFiles('package-lock.json', 'gcp/*/node.dockerfile', 'Dockerfile.*') }}
          restore-keys: |
            nitric-docker-${{ inputs.org }}-${{ runner.os }}-
            nitric-docker-${{ runner.os }}-

      - name: Disk usage before build
        run: df -h / && docker system df

      - name: Docker state before deploy
        # 2026-09-17: tests the leftover-builder-container theory
        # (actions/runner#1326) for the 5h42m silent hang below — a stray
        # buildx/BuildKit container from a prior run holding stdout/stderr
        # open would show up here.
        run: docker ps -a && docker buildx ls

      - name: Install Nitric CLI
        uses: nitrictech/actions@7a43726a04662d0f1ffce5f9cb1ac26edf391ad7 # v1
        with:
          version: latest

      - name: Deploy Infrastructure
        # 2026-09-17/18: two real dispatches (biovita, then ais-shared) hung
        # silently in this step after the build phase completed, zero GCP
        # resources ever created, the `nitric` process itself still alive
        # (not a crashed/orphaned child) when the job's timeout killed it —
        # rules out the known leftover-builder-container failure mode
        # (actions/runner#1326). timeout-minutes bounds a repeat hang to
        # 30min; the wrapper script sends SIGQUIT after 10min of silent
        # output so Go dumps goroutine stacks for real diagnostic signal
        # (`nitric --verbose` is dead code in the CLI, confirmed 2026-09-17).
        timeout-minutes: 30
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          DOCKER_BUILD_CACHE_SRC: .nitric/docker-cache/read
          DOCKER_BUILD_CACHE_DEST: .nitric/docker-cache/write
        run: .github/scripts/nitric-up-stall-dump.sh "${{ inputs.org }}"

      - name: Upload per-service collect logs
        # Survives even if timeout-minutes kills the whole step before the
        # wrapper script's own cleanup runs — see its header comment.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nitric-collect-logs-${{ inputs.org }}
          path: .nitric/collect/
          if-no-files-found: ignore
          retention-days: 7
