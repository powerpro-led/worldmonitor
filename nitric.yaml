name: worldmonitor
# Local dev-mode service matcher for `nitric start`/`nitric run`. Modeled on
# platform/backend's nitric.yaml (sibling repo, same GCP target). Each entry's
# `runtime` key must have a matching block in `runtimes:` below, which is what
# `nitric.gcp.yaml` + `nitric build` use to produce the deployable image.
#
# Scaffold-only pass — see docs/architecture/nitric-gcp-scaffold.md for what's
# real vs. stubbed here. No `nitric up` has been run against this config.
services:
  - match: gcp/api/main.ts
    start: npx tsx watch --env-file=.env $SERVICE_PATH
    runtime: api
  - match: gcp/scheduler/main.ts
    start: npx tsx watch --env-file=.env $SERVICE_PATH
    runtime: scheduler
  # P14 Phase 2 tail (PLATFORM_ARCHITECTURE.md, 2026-09-07): a per-org deploy
  # now has ZERO pinned instances (generate-nitric-org-stack.mjs's
  # PINNED_SERVICES is empty). ais-relay.cjs — the sole genuinely persistent
  # connection (aisstream.io WebSocket) — runs as ONE SHARED deploy instead:
  # deploy/shared/ais-ingest.yml + nitric.ais-shared.yaml +
  # .github/workflows/deploy-ais-shared.yml (min-instances: 1 there). Its 28
  # seed/warm-ping loops are standalone crons (gcp/scheduler/main.ts CADENCES);
  # Telegram + the TransitSummary merge are per-org `--once` jobs (P18 / P14
  # Phase 2 tail); the pure-AIS transit counts reach each org via
  # scripts/sync-ais-results.mjs (P17). This service entry stays here for
  # local `nitric start` dev (one machine, everything in one process) and is
  # what the shared stack deploys; per-org stacks leave it at min-instances: 0.
  - match: scripts/ais-relay.cjs
    start: node $SERVICE_PATH
    runtime: relay
  - match: scripts/seed-bundle-portwatch-port-activity.mjs
    start: node $SERVICE_PATH
    runtime: seed-bundle-portwatch-port-activity
  - match: scripts/seed-bundle-resilience-validation.mjs
    # Sensitivity-Suite (validate-resilience-sensitivity.mjs) dynamically imports
    # ../server/*.ts — needs the tsx ESM loader registered via NODE_OPTIONS so
    # _bundle-runner.mjs's spawned node children inherit it too (spawn() inherits
    # process.env by default). Mirrors Dockerfile.seed-bundle-resilience-validation's
    # ENV NODE_OPTIONS wiring, which local `node $SERVICE_PATH` never had.
    start: NODE_OPTIONS=--import=file://$PWD/node_modules/tsx/dist/loader.mjs node $SERVICE_PATH
    runtime: seed-bundle-resilience-validation
  - match: scripts/loop-fetch-gpsjam.mjs
    # Local-dev-only wrapper (see its own header). scripts/fetch-gpsjam.mjs is
    # scheduled for real by gcp/scheduler/main.ts's CADENCES map ('fetch-gpsjam',
    # every 1 day) — which `nitric start` DOES load as the `scheduler` service —
    # but a Nitric schedule().every() first fires only after the interval
    # elapses, so a fresh `nitric start` (or a local Redis reset) leaves
    # intelligence:gpsjam:v2 empty and /api/gpsjam 503ing for up to 24h. This
    # wrapper runs the seeder once immediately, then daily. Reuses the
    # `scheduler` runtime's own image (full-repo node, whose stated job is
    # "spawns the existing scripts/seed-*.mjs entries as child processes") via
    # a same-dockerfile runtime alias below — no new Dockerfile for a
    # scaffold-only, never-deployed local convenience. Production path is
    # untouched.
    start: node $SERVICE_PATH
    runtime: loop-fetch-gpsjam

runtimes:
  api:
    dockerfile: gcp/api/node.dockerfile
    context: .
  scheduler:
    dockerfile: gcp/scheduler/node.dockerfile
    context: .
  # Local-dev-only alias of the scheduler image for scripts/loop-fetch-gpsjam.mjs
  # (see that service entry above). Same generic full-repo node image; never
  # built for a real deploy.
  loop-fetch-gpsjam:
    dockerfile: gcp/scheduler/node.dockerfile
    context: .
  relay:
    dockerfile: Dockerfile.relay
    context: .
  seed-bundle-portwatch-port-activity:
    dockerfile: Dockerfile.seed-bundle-portwatch-port-activity
    context: .
  seed-bundle-resilience-validation:
    dockerfile: Dockerfile.seed-bundle-resilience-validation
    context: .
  # digest-notifications / publish-bootstrap-tiers / process-simulation-tasks
  # / process-deep-forecast-tasks / scenario-worker runtimes removed here
  # (P14 Phase 1, 2026-09-05) — no longer wired as pinned nitric services,
  # see the services: block above. Dockerfile.digest-notifications and
  # Dockerfile.publish-bootstrap-tiers are untouched on disk (Railway's real,
  # currently-live artifacts — scripts/railway-services.json still points at
  # them). Dockerfile.process-simulation-tasks / .process-deep-forecast-tasks
  # / .scenario-worker are ALSO left on disk, deliberately not deleted this
  # pass: unlike the other two, no registry entry or CI step references them
  # (a pre-existing gap — tests/railway-services-registry-coverage.test.mts
  # already fails on this, confirmed unrelated to this change), so whether
  # Railway's dashboard has ever pointed at them independently of the JSON
  # registry could not be confirmed from this environment. Safe to delete
  # once that's confirmed with the operator.
