name: worldmonitor
# Local dev-mode service matcher for `nitric start`/`nitric run`. Modeled on
# platform/backend's nitric.yaml (sibling repo, same GCP target). Each entry's
# `runtime` key must have a matching block in `runtimes:` below, which is what
# `nitric.gcp.yaml` + `nitric build` use to produce the deployable image.
#
# Scaffold-only pass — see docs/architecture/nitric-gcp-scaffold.md for what's
# real vs. stubbed here. No `nitric up` has been run against this config.
services:
  - match: gcp/api/main.ts
    start: npx tsx watch --env-file=.env $SERVICE_PATH
    runtime: api
  - match: gcp/scheduler/main.ts
    start: npx tsx watch --env-file=.env $SERVICE_PATH
    runtime: scheduler
    # biovita GCP cost incident follow-up (2026-09-23): `runtime:` only picks
    # the Dockerfile/build context — it is NOT what a per-service stack
    # `config.<name>` override (see scripts/generate-nitric-org-stack.mjs's
    # SERVICE_CLOUDRUN_OVERRIDES) matches against. Confirmed via nitrictech/
    # cli's own source (pkg/project/config.go's `ServiceConfiguration.Type`,
    # `yaml:"type,omitempty"`) and nitrictech/nitric's gcp provider
    # (cloud/gcp/deploy/service.go: `p.GcpConfig.Config[config.Type]`, empty
    # string defaults to "default") — org-provisioning-05 traced the provider
    # side after `config.scheduler.cloudrun.timeout: 360` deployed but
    # `scheduler-main` still showed the shared 120s default. Without this
    # `type:` field every service's Type is "", so every per-service override
    # keyed by anything other than "default" is silently unreachable — this
    # was true for the current scheduler override AND for the historical
    # `ais-relay` min-instances pin before that service was removed
    # 2026-09-18 (unconfirmed whether that one was ever actually verified
    # live via gcloud, or just assumed to work the same way).
    type: scheduler
  # scripts/ais-relay.cjs was a service here until 2026-09-18. Background
  # (P14 Phase 2 tail, PLATFORM_ARCHITECTURE.md 2026-09-07): the relay holds
  # the platform's only genuinely persistent connection (the aisstream.io
  # WebSocket), so it runs as ONE SHARED deploy rather than once per org —
  # deploy/shared/ais-ingest.yml + .github/workflows/deploy-ais-shared.yml.
  # Per-org clients reach it over vars.WS_RELAY_URL; the pure-AIS transit
  # counts arrive via scripts/sync-ais-results.mjs (P17).
  #
  # The entry stayed here on the assumption that a per-org stack would simply
  # leave it at min-instances: 0 and cost nothing. The first successful
  # per-org deploy (biovita, 2026-09-18) showed what actually happens: the
  # container FATALs on startup — `AISSTREAM_API_KEY environment variable not
  # set`, since that key is ais-shared-only — and every org project is left
  # with a Cloud Run service that can never serve a request. It doesn't fail
  # the deploy (a min-instances: 0 service is created even when its container
  # can't start), it is just permanently dead weight, plus one more image to
  # build on every deploy.
  #
  # The shared deploy no longer reads this file either: it stopped using
  # Nitric the same day and builds Dockerfile.relay directly. For local
  # `nitric start`, run the relay alongside it: `node scripts/ais-relay.cjs`.
  # scripts/seed-bundle-portwatch-port-activity.mjs and
  # scripts/seed-bundle-resilience-validation.mjs were services here until
  # 2026-09-18. Removed because, as nitric services, they could never have
  # worked — and one of them hard-blocked every deploy:
  #
  #   * NOTHING WOULD EVER TRIGGER THEM. Both are `deployMode: dockerfile`
  #     Railway cron services (scripts/railway-services.json), where Railway's
  #     own cron does the triggering. Neither imports @nitric/sdk, so neither
  #     declares a schedule() — nitric deployed each as a Cloud Run service
  #     with no Cloud Scheduler job pointing at it. gcp/scheduler/main.ts's
  #     CADENCES can't cover them either: it filters to
  #     `deployMode.startsWith('nixpacks')`, which deliberately excludes both.
  #   * portwatch-port-activity BROKE THE WHOLE DEPLOY. Nitric derives a Cloud
  #     Run service_id as `<project>_<path>` (pathToNormalizedServiceName, no
  #     override) — `worldmonitor-scripts-seed-bundle-portwatch-port-activity`
  #     is 56 chars against GCP's 50-char limit, so `nitric up` failed with a
  #     400 after creating 183 other resources (run 35331266844, the first one
  #     ever to reach Pulumi).
  #
  # They keep running on Railway, unaffected — railway-services.json, both
  # Dockerfiles and the scripts themselves are untouched. Moving them to GCP
  # for real needs a trigger designed first (a CADENCES entry via nixpacks
  # mode, or an explicit Cloud Scheduler -> Cloud Run job), not a bare service
  # entry here.
  # scripts/loop-fetch-gpsjam.mjs was a service here until 2026-09-18. It was
  # added as a local-dev convenience on the premise that this file was
  # "scaffold-only, never deployed" — the first real `nitric up` runs
  # invalidated that: nitric has no per-stack service selection, so EVERY
  # entry here is built and deployed by every stack. Two concrete problems:
  # its runtime aliased gcp/scheduler/node.dockerfile, whose CMD hardcodes
  # that image's own entrypoint (then `tsx gcp/scheduler/main.ts`; since
  # 2026-09-19 the prebuilt `gcp/scheduler/main.bundle.mjs`) — so the
  # deployed service was a second copy
  # of the scheduler, re-registering every Cloud Scheduler cadence (real
  # duplicate GCP cost and duplicate seed runs). And had the CMD actually
  # pointed at the wrapper, its `for(;;)` + 24h setTimeout would have hung
  # `nitric up`'s collection phase the same way the unref'd hydration
  # interval did (see server/_shared/pipeline-config-hydration.ts).
  # The production cadence was always gcp/scheduler/main.ts's CADENCES entry
  # ('fetch-gpsjam', every 1 day) — unaffected. The script itself is kept:
  # run `node scripts/loop-fetch-gpsjam.mjs` by hand when a fresh local
  # `nitric start` leaves intelligence:gpsjam:v2 empty, or just
  # `node scripts/fetch-gpsjam.mjs` once.

runtimes:
  api:
    dockerfile: gcp/api/node.dockerfile
    context: .
  scheduler:
    dockerfile: gcp/scheduler/node.dockerfile
    context: .
  # loop-fetch-gpsjam's scheduler-image alias, and the
  # seed-bundle-portwatch-port-activity / seed-bundle-resilience-validation
  # runtimes, were removed 2026-09-18 along with their service entries — see
  # the notes in `services:` above. Their Dockerfiles stay on disk: Railway
  # still builds and runs all three.
  # The `relay` runtime was removed 2026-09-18 with its service entry (see the
  # note in `services:`). Dockerfile.relay stays on disk and is very much in
  # use — .github/workflows/deploy-ais-shared.yml builds it directly now.
  # digest-notifications / publish-bootstrap-tiers / process-simulation-tasks
  # / process-deep-forecast-tasks / scenario-worker runtimes removed here
  # (P14 Phase 1, 2026-09-05) — no longer wired as pinned nitric services,
  # see the services: block above. Dockerfile.digest-notifications and
  # Dockerfile.publish-bootstrap-tiers are untouched on disk (Railway's real,
  # currently-live artifacts — scripts/railway-services.json still points at
  # them). Dockerfile.process-simulation-tasks / .process-deep-forecast-tasks
  # / .scenario-worker are ALSO left on disk, deliberately not deleted this
  # pass: unlike the other two, no registry entry or CI step references them
  # (a pre-existing gap — tests/railway-services-registry-coverage.test.mts
  # already fails on this, confirmed unrelated to this change), so whether
  # Railway's dashboard has ever pointed at them independently of the JSON
  # registry could not be confirmed from this environment. Safe to delete
  # once that's confirmed with the operator.
